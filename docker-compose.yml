# Infrastructure services are always available. The application services (server, worker,
# storefront-reference) belong to the `full` profile so daily development can run them with
# `npm run dev` on the host:
#   docker compose up -d                       -> infrastructure only (database + object storage)
#   docker compose --profile full up --build   -> everything
name: tiendasaas

services:
  database:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-tiendasaas}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-tiendasaas}
      TZ: UTC
      PGTZ: UTC
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  # S3 compatible object storage for local development. MinIO no longer publishes public images
  # (see DECISIONS.md), so SeaweedFS is used. Production uses whichever S3 provider is chosen (PRD 16.9).
  storage:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        printf '{"identities":[{"name":"app","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=1024
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
    ports:
      # Host port 9000 keeps the S3_ENDPOINT default (http://localhost:9000) of .env.example.
      - '9000:8333'
    volumes:
      - storage_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:9333/cluster/status || exit 1']
      interval: 5s
      timeout: 5s
      retries: 30

  storage-init:
    image: amazon/aws-cli:latest
    depends_on:
      storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-tiendasaas-assets}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        aws --endpoint-url http://storage:8333 s3api head-bucket --bucket "$$S3_BUCKET" 2>/dev/null ||
        aws --endpoint-url http://storage:8333 s3api create-bucket --bucket "$$S3_BUCKET"

volumes:
  postgres_data:
  storage_data:
